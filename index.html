<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>AI Canvas · 自由创作画布</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<!-- ============ 图标精灵 ============ -->
<svg class="sprite" aria-hidden="true">
  <defs>
    <symbol id="i-cursor" viewBox="0 0 24 24"><path d="M5 3l6.5 16 2.2-6.3L20 10.5 5 3z"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 013 0V11m0-1.5V4.6a1.5 1.5 0 013 0V11m0-.8V6.4a1.5 1.5 0 013 0V13c0 4.4-2.6 7-6.5 7S8 17.4 8 13v-1.2l-2.3-2a1.5 1.5 0 012-2.2L9 9.6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h9a7 7 0 010 14H8"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9h-9a7 7 0 000 14h5"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 015.5 4H9M15 4h3.5A1.5 1.5 0 0120 5.5V9M20 15v3.5a1.5 1.5 0 01-1.5 1.5H15M9 20H5.5A1.5 1.5 0 014 18.5V15"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10.5" r="1.6"/><path d="M4.5 17l4.4-4.2a1.8 1.8 0 012.5 0L16 17"/><path d="M14.6 14.4l1.6-1.5a1.8 1.8 0 012.4 0l1.9 1.8"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4L12 3z"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2.6"/><path d="M16 10.5l4.2-2.4a.7.7 0 011.1.6v6.6a.7.7 0 01-1.1.6L16 13.5z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 5.2l10.2 6.4a.5.5 0 010 .8L7.5 18.8a.5.5 0 01-.8-.4V5.6a.5.5 0 01.8-.4z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2.4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.6-3.6"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l1 12.2A1.8 1.8 0 009.3 21h5.4a1.8 1.8 0 001.8-1.8L17.5 7"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 20h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M4 20h16"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.2"/><path d="M15 9V6.2A2.2 2.2 0 0012.8 4H6.2A2.2 2.2 0 004 6.2v6.6A2.2 2.2 0 006.2 15H9"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3.5h7.5L19 9v11.5H6z"/><path d="M13.2 3.6V9H19"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 6.3"/><path d="M20 5.5V11h-5.5"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3.5l8.5 4.6L12 12.7 3.5 8.1z"/><path d="M3.5 12.6L12 17.2l8.5-4.6"/><path d="M3.5 16.6L12 21.2l8.5-4.6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.8l4.4 4.2L19 7"/></symbol>
  </defs>
</svg>

<div class="app">

  <!-- ============ 顶部导航栏 ============ -->
  <header class="navbar">
    <div class="navbar__side navbar__side--left">
      <button class="btn btn--icon" id="btnMenu" type="button" title="更多">
        <svg class="ico"><use href="#i-more"/></svg>
      </button>
    </div>

    <div class="navbar__center">
      <button class="doctitle" id="btnRename" type="button" title="重命名">
        <span class="doctitle__name" id="docName">未命名画布</span>
        <span class="doctitle__meta" id="docMeta">本地草稿</span>
      </button>
    </div>

    <div class="navbar__side navbar__side--right">
      <button class="btn btn--icon" id="btnTheme" type="button" title="切换外观">
        <svg class="ico ico--sun"><use href="#i-sun"/></svg>
        <svg class="ico ico--moon"><use href="#i-moon"/></svg>
      </button>
      <button class="btn btn--primary" id="btnCreate" type="button">
        <svg class="ico"><use href="#i-plus"/></svg>
        <span class="btn__label">创建</span>
      </button>
    </div>
  </header>

  <!-- ============ 画布 ============ -->
  <main class="board" id="board">
    <div class="board__grid" id="gridLayer" aria-hidden="true"></div>

    <!-- 连线层：在卡片之下 -->
    <svg class="board__links" id="linksSvg" aria-hidden="true"><g id="linkGroup"></g></svg>

    <div class="board__world" id="world" aria-hidden="true">
      <div class="board__items" id="itemsLayer"></div>
    </div>

    <!-- 浮层：拖拽中的连线 + 删除按钮，在卡片之上 -->
    <svg class="board__overlay" id="overlaySvg" aria-hidden="true"><g id="overlayGroup"></g></svg>

    <div class="marquee" id="marquee" hidden></div>

    <!-- 空状态 -->
    <div class="empty" id="emptyState">
      <div class="empty__card">
        <div class="empty__glyph"><svg class="ico"><use href="#i-sparkle"/></svg></div>
        <h2 class="empty__title">自由创作画布</h2>
        <p class="empty__text">双击任意位置创建 AI 模型，或把电脑里的图片直接拖进来。</p>
        <button class="btn btn--primary" id="btnEmptyCreate" type="button">
          <svg class="ico"><use href="#i-plus"/></svg><span class="btn__label">创建模型</span>
        </button>
      </div>
    </div>

    <!-- 拖入图片提示 -->
    <div class="dropcue" id="dropCue" hidden>
      <div class="dropcue__inner">
        <svg class="ico"><use href="#i-image"/></svg>
        <span id="dropCueText">松开即可放入画布</span>
      </div>
    </div>

    <!-- 首次提示 -->
    <div class="hintbar" id="hintBar">
      <span>双击创建 · 拖入图片 · 空白处拖拽框选 · 空格拖拽平移 · ⌘/Ctrl + 滚轮缩放</span>
      <button class="hintbar__x" id="hintClose" type="button" aria-label="关闭">
        <svg class="ico"><use href="#i-close"/></svg>
      </button>
    </div>

    <!-- 左侧工具条 -->
    <div class="rail" role="toolbar" aria-label="工具">
      <button class="rail__btn is-active" id="toolSelect" type="button" data-tool="select" title="选择 (V)">
        <svg class="ico"><use href="#i-cursor"/></svg>
      </button>
      <button class="rail__btn" id="toolPan" type="button" data-tool="pan" title="平移 (H)">
        <svg class="ico"><use href="#i-hand"/></svg>
      </button>
      <div class="rail__sep"></div>
      <button class="rail__btn" id="toolImage" type="button" title="添加图片">
        <svg class="ico"><use href="#i-image"/></svg>
      </button>
      <button class="rail__btn" id="toolCreate" type="button" title="创建模型 (N)">
        <svg class="ico"><use href="#i-plus"/></svg>
      </button>
      <div class="rail__sep"></div>
      <button class="rail__btn" id="btnUndo" type="button" title="撤销 (⌘Z)">
        <svg class="ico"><use href="#i-undo"/></svg>
      </button>
      <button class="rail__btn" id="btnRedo" type="button" title="重做 (⇧⌘Z)">
        <svg class="ico"><use href="#i-redo"/></svg>
      </button>
    </div>

    <!-- 底部缩放条 -->
    <div class="zoombar">
      <button class="zoombar__btn" id="zoomOut" type="button" title="缩小">
        <svg class="ico"><use href="#i-minus"/></svg>
      </button>
      <button class="zoombar__value" id="zoomValue" type="button" title="重置为 100%">100%</button>
      <button class="zoombar__btn" id="zoomIn" type="button" title="放大">
        <svg class="ico"><use href="#i-plus"/></svg>
      </button>
      <div class="zoombar__sep"></div>
      <button class="zoombar__btn" id="zoomFit" type="button" title="适应视图 (⌘0)">
        <svg class="ico"><use href="#i-fit"/></svg>
      </button>
      <div class="zoombar__sep"></div>
      <button class="zoombar__btn" id="zoomReset" type="button" title="回到原点">
        <svg class="ico"><use href="#i-layers"/></svg>
      </button>
    </div>

    <!-- 状态条 -->
    <div class="statusbar" id="statusbar">
      <span class="statusbar__item" id="statCount">空画布</span>
      <span class="statusbar__dot"></span>
      <span class="statusbar__item" id="statSave">未保存</span>
    </div>

    <!-- 双击创建菜单（跟随鼠标） -->
    <div class="ctxmenu" id="ctxMenu" hidden role="menu" aria-label="创建"></div>
  </main>

  <!-- ============ 弹层 ============ -->
  <div class="scrim" id="scrim" hidden></div>

  <section class="sheet sheet--compact" id="menuSheet" aria-hidden="true">
    <div class="sheet__grab"></div>
    <div class="sheet__body" id="menuBody"></div>
  </section>

  <div class="dialog-wrap" id="dialogWrap" hidden>
    <div class="dialog" role="dialog" aria-modal="true">
      <div class="dialog__content">
        <h3 class="dialog__title" id="dialogTitle">标题</h3>
        <p class="dialog__text" id="dialogText"></p>
        <input class="dialog__input" id="dialogInput" type="text" hidden>
      </div>
      <div class="dialog__actions" id="dialogActions"></div>
    </div>
  </div>

  <div class="toasts" id="toastHost"></div>
  <input type="file" id="imageInput" accept="image/*" multiple hidden>
  <input type="file" id="jsonInput" accept="application/json,.json" hidden>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/geometry.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/generate.js"></script>
<script src="assets/js/interactions.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
